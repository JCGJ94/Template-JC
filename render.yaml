services:
    - type: web
      region: ohio
      name: my-fullstack-app
      env: python
      buildCommand: "./render_build.sh"
      startCommand: "gunicorn wsgi --chdir ./src/"
      plan: free
      numInstances: 1
      envVars:
          - key: FLASK_APP
            value: src/app.py
          - key: FLASK_DEBUG
            value: 0
          - key: PYTHON_VERSION
            value: 3.11
          - key: DATABASE_URL
            fromDatabase:
                name: my-database
                property: connectionString

databases:
    - name: my-database
      region: ohio
      plan: free
