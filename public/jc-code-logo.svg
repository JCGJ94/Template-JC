    <path d="M100 56 C82 56 68 70 68 96 C68 124 86 140 100 140 C114 140 132 124 132 96 C132 70 118 56 100 56 Z" fill="url(#shadow)" stroke="#251513" stroke-width="5" />
    <path d="M52 64 L26 18 L56 30 L78 60 Z" fill="#f9b95a" stroke="#251513" stroke-width="6" stroke-linejoin="round" />
    <path d="M148 64 L174 18 L144 30 L122 60 Z" fill="#f9b95a" stroke="#251513" stroke-width="6" stroke-linejoin="round" />
    <path d="M74 104 Q84 96 94 102 Q100 108 106 102 Q116 96 126 104 Q128 120 100 124 Q72 120 74 104 Z" fill="#251513" />
    <path d="M60 96 C60 84 70 76 80 76" fill="none" stroke="#251513" stroke-width="6" stroke-linecap="round" />
