<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" role="img" aria-labelledby="title desc">
  <title id="title">JC Code Fox Logo</title>
  <desc id="desc">Fox wearing a headset over a keyboard with the text JC-CODE</desc>
  <defs>
